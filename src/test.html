<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Macro Target</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0a0a0a;
        color: #e5e5e5;
        font-family: 'Inter', sans-serif;
        user-select: none;
      }
      header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 16px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 10;
        pointer-events: none;
      }
      .cps-display {
        font-size: 2.5rem;
        font-weight: 700;
        color: white;
        text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      }
      .cps-label {
        font-size: 1rem;
        color: #888;
        font-weight: 500;
        margin-top: -4px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .controls-hint {
        font-size: 0.9rem;
        color: #aaa;
        background: rgba(0,0,0,0.6);
        padding: 8px 12px;
        border-radius: 6px;
        backdrop-filter: blur(4px);
        text-align: right;
      }
      
      /* Pure CSS 3D Engine */
      #viewport {
        perspective: 800px;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        position: relative;
      }
      #world {
        transform-style: preserve-3d;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0; left: 0;
        transform-origin: 50% 50%;
      }
      
      #ground {
        position: absolute;
        width: 2000px;
        height: 2000px;
        background: #333;
        /* create a simple grid */
        background-image: 
          linear-gradient(rgba(255,255,255,0.15) 2px, transparent 2px),
          linear-gradient(90deg, rgba(255,255,255,0.15) 2px, transparent 2px);
        background-size: 100px 100px;
        transform: rotateX(90deg);
        backface-visibility: hidden;
        left: 50%;
        top: 50%;
        margin-left: -1000px;
        margin-top: -1000px;
        pointer-events: none;
      }

      #character {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-style: preserve-3d;
        cursor: pointer;
        pointer-events: auto;
      }
      
      .mc-joint {
        position: absolute;
        transform-style: preserve-3d;
      }
      
      .mc-box {
        position: absolute;
        transform-style: preserve-3d;
      }
      
      .mc-face {
        position: absolute;
        box-sizing: border-box;
        border: 1px solid rgba(0,0,0,0.3);
      }
      
      @keyframes pulse {
        from { opacity: 0.7; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1.05); }
      }
      
      .flash .mc-face {
        background: #ffffff !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div id="cps-value" class="cps-display">0</div>
        <div class="cps-label">Clicks / Sec</div>
        <div id="ac-warning" style="display: none; color: #ff3333; font-weight: 700; font-size: 1.2rem; margin-top: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); animation: pulse 0.5s infinite alternate; transform-origin: left center;">
          ⚠️ AUTOCLICKER DETECTED
        </div>
      </div>
      <div class="controls-hint">
        WASD to Move<br>
        Space to Jump<br>
        Left Click to Hit
      </div>
    </header>
    
    <div id="viewport">
      <div id="world">
        <div id="ground"></div>
        <div id="character">
          <!-- Parts generated by JS -->
        </div>
      </div>
    </div>

    <script>
      // Prevent right-click context menu
      document.addEventListener('contextmenu', e => e.preventDefault());

      const character = document.getElementById('character');
      const world = document.getElementById('world');
      
      // Minecraft Character Generator
      function createBox(w, h, d, color) {
        const box = document.createElement('div');
        box.className = 'mc-box';
        box.style.width = w + 'px';
        box.style.height = h + 'px';
        box.style.marginLeft = -(w/2) + 'px';
        box.style.marginTop = -(h/2) + 'px';
        
        const transforms = {
          front:  `rotateY(0deg) translateZ(${d/2}px)`,
          back:   `rotateY(180deg) translateZ(${d/2}px)`,
          left:   `rotateY(-90deg) translateZ(${w/2}px)`,
          right:  `rotateY(90deg) translateZ(${w/2}px)`,
          top:    `rotateX(90deg) translateZ(${h/2}px)`,
          bottom: `rotateX(-90deg) translateZ(${h/2}px)`
        };

        for (const [name, trans] of Object.entries(transforms)) {
          const face = document.createElement('div');
          face.className = 'mc-face';
          face.style.background = color;
          face.style.transform = trans;
          if (name === 'front' || name === 'back') {
            face.style.width = w + 'px'; face.style.height = h + 'px';
          } else if (name === 'left' || name === 'right') {
            face.style.width = d + 'px'; face.style.height = h + 'px';
            face.style.marginLeft = (w - d)/2 + 'px';
          } else if (name === 'top' || name === 'bottom') {
            face.style.width = w + 'px'; face.style.height = d + 'px';
            face.style.marginTop = (h - d)/2 + 'px';
          }
          box.appendChild(face);
        }
        return box;
      }

      function createPart(w, h, d, color, jX, jY, jZ, offsetY) {
        const joint = document.createElement('div');
        joint.className = 'mc-joint';
        joint.style.transform = `translate3d(${jX}px, ${jY}px, ${jZ}px)`;
        const box = createBox(w, h, d, color);
        box.style.transform = `translate3d(0px, ${offsetY}px, 0px)`;
        joint.appendChild(box);
        character.appendChild(joint);
        return joint;
      }

      const skinColor = '#ffccaa';
      const shirtColor = '#4488ff';
      const pantsColor = '#224488';
      const hairColor = '#553311';

      // 1 unit = 2px scale
      const head = createPart(16, 16, 16, skinColor, 0, -48, 0, -8);
      const torso = createPart(16, 24, 8, shirtColor, 0, -48, 0, 12);
      const leftArm = createPart(8, 24, 8, skinColor, -12, -48, 0, 12);
      const rightArm = createPart(8, 24, 8, skinColor, 12, -48, 0, 12);
      const leftLeg = createPart(8, 24, 8, pantsColor, -4, -24, 0, 12);
      const rightLeg = createPart(8, 24, 8, pantsColor, 4, -24, 0, 12);

      // Character Physics State
      let charX = 0;
      let charZ = 0;
      let charY = 0; // 0 is ground, negative is UP in CSS Y-axis
      let velocityY = 0;
      let charRotation = 0;
      const gravity = 2000;
      const jumpForce = -700;
      
      // Input State
      const keys = { w: false, a: false, s: false, d: false };
      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (keys.hasOwnProperty(k)) keys[k] = true;
        if (k === ' ' && charY >= 0) {
          velocityY = jumpForce;
        }
      });
      window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (keys.hasOwnProperty(k)) keys[k] = false;
      });

      // CPS Tracking
      let clickTimes = [];
      const cpsDisplay = document.getElementById('cps-value');
      const acWarning = document.getElementById('ac-warning');
      
      let isHitting = false;
      let lastHitTime = 0;

      window.addEventListener('mousedown', () => {
        clickTimes.push(performance.now());
        isHitting = true;
        lastHitTime = performance.now();
      }, true);
      
      function updateCPS() {
        const now = performance.now();
        let startIndex = 0;
        for (let i = 0; i < clickTimes.length; i++) {
          if (now - clickTimes[i] <= 1000) {
            startIndex = i;
            break;
          }
        }
        if (clickTimes.length > 0 && now - clickTimes[clickTimes.length - 1] > 1000) {
           clickTimes = [];
        } else {
           clickTimes = clickTimes.slice(startIndex);
        }
        
        const cps = clickTimes.length;
        cpsDisplay.textContent = cps;
        
        if (cps >= 20) {
          acWarning.style.display = 'block';
        } else {
          acWarning.style.display = 'none';
        }
      }
      setInterval(updateCPS, 100);

      // Character Click Detection
      let isFlashing = false;
      character.addEventListener('mousedown', (e) => {
        e.stopPropagation();

        if (!isFlashing) {
          isFlashing = true;
          character.classList.add('flash');
          setTimeout(() => {
            character.classList.remove('flash');
            isFlashing = false;
          }, 100);
        }
      });

      // Animation Loop
      let lastTime = performance.now();
      const speed = 400; // pixels per second
      let walkCycle = 0;

      function animate(time) {
        requestAnimationFrame(animate);
        const delta = (time - lastTime) / 1000;
        lastTime = time;
        if (delta > 0.1) return; // prevent massive jumps

        let moveX = 0;
        let moveZ = 0;

        if (keys.w) moveZ -= 1;
        if (keys.s) moveZ += 1;
        if (keys.a) moveX -= 1;
        if (keys.d) moveX += 1;

        // Apply movement
        if (moveX !== 0 || moveZ !== 0) {
          const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
          charX += (moveX / length) * speed * delta;
          charZ += (moveZ / length) * speed * delta;
          
          charX = Math.max(-950, Math.min(950, charX));
          charZ = Math.max(-950, Math.min(950, charZ));
          
          charRotation = 0; // Always face forward

          walkCycle += speed * delta * 0.05;
        } else {
          // Return to idle stance
          walkCycle *= 0.9;
        }

        // Apply Jump Physics
        velocityY += gravity * delta;
        charY += velocityY * delta;
        if (charY > 0) {
          charY = 0;
          velocityY = 0;
        }

        // Hit Animation Logic
        if (time - lastHitTime > 150) {
          isHitting = false;
          hitCycle = 0;
        } else {
          hitCycle += 1500 * delta; 
        }
        const hitSwing = isHitting ? Math.abs(Math.sin(hitCycle * Math.PI / 180)) * 110 : 0;

        // Apply Global Transform
        character.style.transform = `translate3d(${charX}px, ${charY}px, ${charZ}px) rotateY(${charRotation}deg)`;

        // Apply Limb Animations
        const swing = Math.sin(walkCycle) * 45; // 45 degrees swing
        leftArm.style.transform = `translate3d(-12px, -48px, 0px) rotateX(${swing}deg)`;
        rightArm.style.transform = `translate3d(12px, -48px, 0px) rotateX(${-swing - hitSwing}deg)`;
        leftLeg.style.transform = `translate3d(-4px, -24px, 0px) rotateX(${-swing}deg)`;
        rightLeg.style.transform = `translate3d(4px, -24px, 0px) rotateX(${swing}deg)`;

        // Update Camera
        const camYOffset = 50;   // Push world DOWN (camera goes UP)
        const camZOffset = -80;  // Push world AWAY (camera goes BACK)
        const camAngleX = -10;   // Tilt world FORWARD (camera looks DOWN at top)

        world.style.transform = `
          translateZ(${camZOffset}px) 
          translateY(${camYOffset}px) 
          rotateX(${camAngleX}deg) 
          translateX(${-charX}px) 
          translateY(${-charY}px)
          translateZ(${-charZ}px)
        `;
      }

      requestAnimationFrame(animate);
    </script>
  </body>
</html>
