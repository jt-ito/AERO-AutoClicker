<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERO AutoClicker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body class="dark-mode">
    <div class="app-container">
      <header data-tauri-drag-region>
        <div class="header-left">
          <h1>AERO</h1>
          <nav class="view-tabs">
            <button id="tab-clicker" class="tab-btn active">AutoClicker</button>
            <button id="tab-macro" class="tab-btn">Macro</button>
          </nav>
        </div>
        <div class="header-right" style="display: flex; gap: 8px;">
          <button id="test-page-btn" class="icon-btn" aria-label="Open Test Page" title="Open Test Page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
          </button>
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle Theme">
            <!-- SVG for dark/light toggle will be injected via JS -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </button>
        </div>
      </header>
      
      <main>
        <section class="card" style="margin-bottom: 12px; flex-shrink: 0;">
          <div class="form-group row">
            <label class="custom-checkbox" style="margin-bottom: 8px; font-weight: 500;">
              <input type="checkbox" id="enable-target-window" checked />
              <span class="checkmark"></span>
              Target Window
            </label>
            <div class="input-with-btn">
              <select id="window-select">
                <option value="" disabled selected>Select a window...</option>
              </select>
              <button id="refresh-btn" class="secondary-btn">Refresh</button>
            </div>
          </div>
        </section>

        <!-- CLICKER VIEW -->
        <div id="clicker-view" class="view active">
          <section class="card">
            <div class="row">
              <div class="form-group half">
                <label for="interval">Interval (ms)</label>
                <input type="number" id="interval" value="100" min="1" />
              </div>
              <div class="form-group half checkbox-group">
                <label class="custom-checkbox">
                  <input type="checkbox" id="double-click" />
                  <span class="checkmark"></span>
                  Double-click
                </label>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="row coords-row">
              <div class="form-group coord">
                <label for="coord-x">X</label>
                <input type="number" id="coord-x" value="0" />
              </div>
              <div class="form-group coord">
                <label for="coord-y">Y</label>
                <input type="number" id="coord-y" value="0" />
              </div>
              <button id="pick-btn" class="secondary-btn pick-btn">Pick Coords</button>
            </div>
            <p class="hint">0, 0 will click the center of the window.</p>
          </section>

          <section class="card">
            <div class="row">
               <div class="form-group hotkey-group">
                  <label>Hotkey</label>
                  <div class="input-with-btn">
                    <input type="text" id="hotkey-display" value="CommandOrControl+Shift+S" readonly />
                    <button id="record-btn" class="secondary-btn">Record</button>
                  </div>
               </div>
            </div>
            <div class="form-group checkbox-group bg-mode-group">
              <label class="custom-checkbox">
                <input type="checkbox" id="background-mode" />
                <span class="checkmark"></span>
                Background Mode (PostMessage)
              </label>
            </div>
          </section>

          <footer class="action-footer">
            <button id="start-btn" class="primary-btn solid-blue">Start</button>
            <button id="stop-btn" class="primary-btn solid-red" disabled>Stop</button>
          </footer>
        </div>

        <!-- MACRO VIEW -->
        <div id="macro-view" class="view" style="display: none;">
          <section class="card">
            <div class="row">
               <div class="form-group hotkey-group">
                  <label>Macro Record Hotkey</label>
                  <div class="input-with-btn">
                    <input type="text" id="macro-record-hotkey" value="CommandOrControl+Shift+R" readonly />
                    <button id="record-macro-hotkey-btn" class="secondary-btn">Set</button>
                  </div>
               </div>
            </div>
            <p class="hint">Press this keybind globally to start/stop recording mouse actions.</p>
          </section>

          <section class="card">
            <div class="row">
               <div class="form-group hotkey-group">
                  <label>Macro Playback Hotkey</label>
                  <div class="input-with-btn">
                    <input type="text" id="macro-play-hotkey" value="CommandOrControl+Shift+P" readonly />
                    <button id="record-macro-play-hotkey-btn" class="secondary-btn">Set</button>
                  </div>
               </div>
            </div>
          </section>

          <section class="card flex-grow">
            <div class="moves-header">
              <h3>Recorded Moves</h3>
              <button id="clear-moves-btn" class="secondary-btn small-btn">Clear</button>
            </div>
            <div class="moves-container">
              <ul id="moves-list">
                <!-- Recorded moves will be injected here -->
                <li class="empty-state">No moves recorded. Press your record hotkey to start!</li>
              </ul>
            </div>
          </section>

          <footer class="action-footer">
            <button id="play-macro-btn" class="primary-btn solid-blue">Play Macro</button>
            <button id="stop-macro-btn" class="primary-btn solid-red" disabled>Stop Playback</button>
          </footer>
        </div>
      </main>
    </div>
  </body>
</html>
